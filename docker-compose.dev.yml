version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financeiro
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: pnpm --filter apps-api dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/financeiro
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '3333:3333'
    depends_on:
      - postgres
    volumes:
      - .:/app
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: pnpm --filter apps-web dev --turbo
    environment:
      NODE_ENV: development
    ports:
      - '3000:3000'
    depends_on:
      - api
    volumes:
      - .:/app
  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    command: pnpm --filter apps-mobile dev
    environment:
      NODE_ENV: development
    ports:
      - '8081:8081'
    volumes:
      - .:/app
volumes:
  pgdata:
